[platformio]
default_envs = pc

[env:pc]
platform = native
build_flags = -Wall -Wextra -lraylib -lGL -lm
build_src_filter = 
    -<*>
    +<*.c>
    +<hal/raylib/>
    +<modules/graphics/raylib/>
    +<modules/inputs/raylib/>
    +<modules/files/raylib/>
    +<lua/>
    +<lua_modules/>

[env:pico2-lcd1in3]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git 
board = rpipico2
framework = picosdk 
upload_protocol = picotool
monitor_speed = 115200
upload_flags = -f
build_flags = -Wall -Wextra -D PICO_STDIO_USB=1 -D PICO_STDIO_UART=0 -D SERIAL_USB -D DUSB_MMAP_SUPPORT
build_src_filter =
    -<*>
    +<*.c>
    +<hal/pico2/>
    +<modules/graphics/pico2-lcd1in3/>
    +<modules/inputs/pico2/>
    +<modules/files/pico2/>
    +<lua/>
    +<lua_modules/>
